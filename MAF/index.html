<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070b24" />
<title>中秋快乐 · 花好月圆</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    position:fixed; inset:0; width:100%;
    font-family:'Noto Serif SC', 'Songti SC', serif;
    background:#070b24; color:#ffe9c4;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #sky { position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(1100px 620px at 76% 10%, rgba(255,214,140,.16), transparent 60%),
      radial-gradient(900px 500px at 50% 108%, rgba(255,150,80,.20), transparent 60%),
      linear-gradient(180deg, #05081f 0%, #0c123d 36%, #1e2560 58%, #4c3560 76%, #8a4f3c 92%, #b06a42 100%);
  }
  /* 单块画布：星星 + 花瓣，一次 clear 一次循环 */
  #fx { position:fixed; inset:0; z-index:6; pointer-events:none; }

  /* ---------- 明月（光晕用独立层做 transform/opacity 脉动，零重绘） ---------- */
  .moon { position:fixed; z-index:2; top:8%; right:11%;
    width:min(26vw, 200px); aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #fffdf6 0%, #ffefc0 34%, #ffdd8f 60%, #f4bd63 100%);
    box-shadow:0 0 50px 14px rgba(255,212,130,.35);
  }
  .moon .halo { position:absolute; inset:-45%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,203,120,.38) 0%, rgba(255,190,110,.12) 45%, transparent 70%);
    animation:haloPulse 7s ease-in-out infinite; will-change:transform,opacity; }
  @keyframes haloPulse { 0%,100% { transform:scale(1); opacity:.85; } 50% { transform:scale(1.08); opacity:1; } }
  .moon::after { content:''; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 64% 58%, rgba(196,146,74,.28) 0 9%, transparent 10%),
      radial-gradient(circle at 42% 64%, rgba(196,146,74,.24) 0 6%, transparent 7%),
      radial-gradient(circle at 56% 36%, rgba(196,146,74,.20) 0 5%, transparent 6%),
      radial-gradient(circle at 30% 44%, rgba(196,146,74,.16) 0 4%, transparent 5%);
  }
  .rabbit { position:absolute; left:16%; bottom:12%; width:36%; opacity:.42; }

  /* ---------- 流云（纯 transform 位移，无 blur 滤镜） ---------- */
  .cloud { position:fixed; z-index:3; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,236,205,.16) 0%, rgba(255,236,205,.05) 55%, transparent 70%);
    animation:drift linear infinite; will-change:transform; }
  @keyframes drift { from { transform:translateX(-30vw); } to { transform:translateX(130vw); } }

  /* ---------- 远山亭台 ---------- */
  .hills { position:fixed; left:0; right:0; bottom:0; width:100%; height:24vh; z-index:4; pointer-events:none; }

  /* ---------- 孔明灯（全部动画只用 transform / opacity） ---------- */
  #lantern-layer { position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .lantern { position:absolute; bottom:-170px; animation:rise var(--dur,19s) linear forwards; will-change:transform; }
  .l-scale { transform:scale(var(--scale,1)); transform-origin:bottom center; }
  .lantern-inner { animation:sway 4.2s ease-in-out infinite alternate; display:flex; flex-direction:column; align-items:center; will-change:transform; }
  @keyframes rise { to { transform:translateY(-135vh); } }
  @keyframes sway { from { transform:translate(-16px,0) rotate(-4deg); } to { transform:translate(16px,0) rotate(4deg); } }
  .lcap { width:26px; height:12px; background:#7a2c12; border-radius:4px 4px 2px 2px; }
  .lbody { position:relative; width:66px; height:86px; margin-top:-2px;
    background:radial-gradient(ellipse at 50% 32%, #ffe3a1 0%, #ffb35c 45%, #f07f2e 75%, #d6541f 100%);
    border-radius:48% 48% 50% 50% / 58% 58% 42% 42%;
    box-shadow:0 0 30px 10px rgba(255,160,70,.50), inset 0 -10px 20px rgba(130,40,5,.45);
    display:flex; align-items:center; justify-content:center;
    animation:lanternFlick 2.8s ease-in-out infinite;
  }
  .lbody::before { content:''; position:absolute; inset:0; border-radius:inherit;
    background:repeating-linear-gradient(90deg, transparent 0 11px, rgba(140,50,8,.16) 11px 13px); }
  .lbody span { font-family:'Ma Shan Zheng', cursive; font-size:30px; color:#8a2c05; z-index:1; text-shadow:0 1px 0 rgba(255,240,210,.5); }
  @keyframes lanternFlick { 0%,100% { opacity:.93; } 50% { opacity:1; } }
  .lbase { width:20px; height:9px; background:#7a2c12; border-radius:2px 2px 4px 4px; margin-top:-1px; }
  .lbase::after { content:''; display:block; width:2px; height:16px; background:rgba(255,190,120,.7); margin:9px auto 0; }

  .vignette { position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(5,6,20,.55) 100%); }

  /* ---------- 标题 ---------- */
  .title-block { position:fixed; z-index:10; top:13%; left:7%; pointer-events:none; }
  .title-block .kicker { font-size:clamp(.85rem,2.4vw,1.05rem); letter-spacing:.55em; color:#ffcf8f; opacity:0; animation:fadeUp 1.2s ease .2s forwards; }
  .title-block h1 { font-family:'Ma Shan Zheng', 'STKaiti', cursive; font-weight:400;
    font-size:clamp(3.2rem,11vw,6.5rem); line-height:1.15; color:#ffedbe; margin:.4rem 0 .2rem;
    text-shadow:0 0 18px rgba(255,196,110,.75), 0 0 60px rgba(255,170,80,.45), 0 4px 24px rgba(120,50,10,.6);
    opacity:0; animation:fadeUp 1.4s ease .55s forwards; }
  .title-block .sub { font-size:clamp(1rem,3vw,1.35rem); letter-spacing:.5em; color:#ffd9a0; opacity:0; animation:fadeUp 1.2s ease 1s forwards; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }

  /* ---------- 对联 ---------- */
  .couplet { position:fixed; z-index:10; top:50%; transform:translateY(-50%);
    writing-mode:vertical-rl; font-family:'Ma Shan Zheng', cursive; font-size:clamp(1.4rem,3.4vw,2.1rem);
    letter-spacing:.9rem; color:rgba(255,224,168,.8); text-shadow:0 0 14px rgba(255,180,100,.5); pointer-events:none;
    opacity:0; animation:fadeUp 1.6s ease 1.4s forwards; }
  .couplet.left { left:3.5%; } .couplet.right { right:3.5%; }

  /* ---------- 底部：祝福卡 + 按钮（flex 堆叠，永不重叠，适配安全区） ---------- */
  .bottom-ui { position:fixed; z-index:10; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:0 14px calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events:none; }
  .bottom-ui > * { pointer-events:auto; }
  .card { width:min(94vw, 600px); padding:20px 26px 16px; text-align:center;
    background:rgba(12,14,44,.52); border:1px solid rgba(255,196,120,.35); border-radius:18px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(255,190,110,.06);
    opacity:0; animation:fadeUp 1.4s ease 1.6s forwards; }
  .card .card-title { font-family:'Ma Shan Zheng', cursive; font-size:1.5rem; color:#ffdf9e; letter-spacing:.3em; margin-bottom:10px; }
  #blessing { font-size:clamp(.95rem,2.6vw,1.08rem); line-height:1.9; color:#ffedd0; min-height:3.6em;
    transition:opacity .8s ease; }
  #blessing.fade { opacity:0; }
  .card .card-foot { margin-top:10px; font-size:.8rem; letter-spacing:.35em; color:rgba(255,207,143,.65); }

  .controls { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:94vw;
    opacity:0; animation:fadeUp 1.4s ease 2s forwards; }
  .controls button { font-family:'Noto Serif SC', serif; font-size:.95rem; letter-spacing:.12em;
    color:#ffe3ae; background:rgba(20,18,52,.55); border:1px solid rgba(255,196,120,.5);
    padding:11px 22px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 4px 18px rgba(0,0,0,.4); transition:background .25s ease, box-shadow .25s ease, transform .15s ease;
    white-space:nowrap; }
  .controls button:hover { background:rgba(255,170,90,.22); box-shadow:0 0 22px rgba(255,180,100,.45); transform:translateY(-2px); }
  .controls button:active { transform:translateY(0) scale(.97); }

  /* ---------- 点击许愿 ---------- */
  .spark { position:fixed; z-index:20; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    background:#fff3c4; box-shadow:0 0 22px 8px rgba(255,220,150,.9);
    pointer-events:none; animation:sparkFlash 1.1s ease-out forwards; }
  .spark::after { content:''; position:absolute; inset:-4px; border:2px solid rgba(255,222,150,.85); border-radius:50%; animation:ring 1.1s ease-out forwards; }
  @keyframes sparkFlash { 0%{ transform:scale(.4); opacity:1; } 100%{ transform:scale(1.7); opacity:0; } }
  @keyframes ring { from{ transform:scale(.5); opacity:1; } to{ transform:scale(4.2); opacity:0; } }
  .wish-text { position:fixed; z-index:20; transform:translate(-50%,-50%); pointer-events:none;
    font-family:'Ma Shan Zheng', cursive; font-size:1.7rem; color:#ffe6ae;
    text-shadow:0 0 14px rgba(255,190,100,.85); animation:wishFloat 2.4s ease-out forwards; white-space:nowrap; }
  @keyframes wishFloat { 0%{ opacity:0; transform:translate(-50%,-30%) scale(.8); } 18%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-200%) scale(1.06); } }

  .toast { position:fixed; z-index:30; left:50%; top:38%; transform:translate(-50%,-50%);
    font-family:'Ma Shan Zheng', cursive; font-size:clamp(1.4rem,5vw,2.2rem); color:#fff0cd;
    text-shadow:0 0 20px rgba(255,190,110,.9); pointer-events:none; opacity:0; transition:opacity .6s ease;
    text-align:center; padding:0 20px; }
  .toast.show { opacity:1; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width:760px){
    .couplet { display:none; }
    .cloud.c3 { display:none; }
    .title-block { top:9%; left:6%; }
    .title-block .kicker { letter-spacing:.4em; }
    .title-block .sub { letter-spacing:.35em; }
    /* 去掉 backdrop blur（它是移动端掉帧大户），用更实底色代替 */
    .card { backdrop-filter:none; -webkit-backdrop-filter:none;
      background:rgba(12,14,44,.82); padding:14px 18px 12px; }
    .card .card-title { font-size:1.25rem; margin-bottom:6px; }
    #blessing { line-height:1.75; min-height:3.4em; }
    .card .card-foot { letter-spacing:.22em; }
    .controls { gap:10px; }
    .controls button { backdrop-filter:none; -webkit-backdrop-filter:none;
      background:rgba(20,18,52,.85); padding:10px 18px; font-size:.88rem; }
    .bottom-ui { gap:10px; padding:0 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
  }
  /* 横屏矮机型：进一步压缩 */
  @media (max-height:500px){
    .title-block { top:5%; }
    .title-block h1 { font-size:clamp(2.2rem,8vh,3rem); }
    .card { padding:10px 18px 8px; }
    #blessing { font-size:.85rem; line-height:1.6; min-height:0; }
    .card .card-foot, .card .card-title { display:none; }
    .controls button { padding:8px 16px; font-size:.82rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lantern, .lantern-inner, .lbody, .moon .halo, .cloud { animation:none !important; }
    .lantern { display:none; }
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <canvas id="fx"></canvas>

  <div class="moon" aria-hidden="true">
    <div class="halo"></div>
    <svg class="rabbit" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="rgba(146,92,36,.55)">
        <ellipse cx="52" cy="72" rx="20" ry="15"/>
        <circle cx="72" cy="56" r="11"/>
        <ellipse cx="66" cy="36" rx="5" ry="14" transform="rotate(-12 66 36)"/>
        <ellipse cx="78" cy="36" rx="5" ry="14" transform="rotate(10 78 36)"/>
        <circle cx="34" cy="76" r="7"/>
      </g>
    </svg>
  </div>

  <div class="cloud c1" style="top:16%; left:0; width:34vw; height:90px; animation-duration:95s;"></div>
  <div class="cloud c2" style="top:30%; left:0; width:26vw; height:70px; animation-duration:130s; animation-delay:-40s;"></div>
  <div class="cloud c3" style="top:8%; left:0; width:22vw; height:60px; animation-duration:160s; animation-delay:-90s;"></div>

  <svg class="hills" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 200 Q 180 138 360 172 T 720 162 T 1080 178 T 1440 158 V240 H0 Z" fill="#0b1030"/>
    <path d="M0 216 Q 240 174 480 204 T 960 198 T 1440 208 V240 H0 Z" fill="#060a22"/>
    <g transform="translate(1160,110)" fill="#0c1233" stroke="rgba(255,200,130,.28)" stroke-width="1.6">
      <rect x="-48" y="56" width="96" height="10" rx="2"/>
      <rect x="-38" y="20" width="8" height="36"/>
      <rect x="-8" y="20" width="8" height="36"/>
      <rect x="30" y="20" width="8" height="36"/>
      <polygon points="-60,20 60,20 0,-10"/>
      <rect x="-15" y="-32" width="30" height="22"/>
      <polygon points="-32,-32 32,-32 0,-56"/>
      <rect x="-2.5" y="-70" width="5" height="14"/>
      <circle cx="0" cy="-72" r="3" fill="rgba(255,200,130,.28)" stroke="none"/>
    </g>
  </svg>

  <div id="lantern-layer"></div>
  <div class="vignette"></div>

  <div class="couplet left">花好月圆</div>
  <div class="couplet right">人寿年丰</div>

  <header class="title-block">
    <p class="kicker">八月十五 · 月圆之夜</p>
    <h1>中秋快乐</h1>
    <p class="sub">花好月圆 · 人团圆</p>
  </header>

  <div class="bottom-ui">
    <section class="card">
      <div class="card-title">🌕 中秋祝福</div>
      <p id="blessing"></p>
      <div class="card-foot">愿君中秋安康 · 阖家团圆</div>
    </section>
    <nav class="controls">
      <button id="btn-lantern" type="button">🏮 放飞天灯</button>
      <button id="btn-wish" type="button">✨ 许个愿</button>
      <button id="btn-music" type="button">🎵 音乐：关</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var W = function(){ return window.innerWidth; };
  var H = function(){ return window.innerHeight; };

  /* ---------- 单画布：星空 + 桂花花瓣 ---------- */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var stars = [], petals = [];
  var petalColors = ['#f7c873','#f2a950','#ffe1a1','#e8933c','#ffd98f'];
  var moonEl = document.querySelector('.moon');
  var moon = { x:0, y:0, r:0 };

  function measureMoon(){
    var r = moonEl.getBoundingClientRect();
    moon.x = r.left + r.width/2;
    moon.y = r.top + r.height/2;
    moon.r = r.width/2;
  }
  function newPetal(top){
    return { x:Math.random()*W(), y: top ? -20 : Math.random()*H(),
      s:3.5+Math.random()*6.5, a:Math.random()*6.283, va:(Math.random()-0.5)*0.06,
      vy:0.35+Math.random()*0.85, ph:Math.random()*6.283, ps:0.008+Math.random()*0.02,
      c:petalColors[(Math.random()*petalColors.length)|0], o:0.55+Math.random()*0.4 };
  }
  function init(){
    cv.width = W(); cv.height = H();
    measureMoon();
    var ns = Math.max(90, Math.min(220, Math.floor(W()*H()/11000)));
    stars = [];
    for(var i=0;i<ns;i++){
      stars.push({ x:Math.random()*W(), y:Math.random()*H()*0.72,
        r:0.3+Math.random()*1.4, p:Math.random()*6.283, s:0.4+Math.random()*1.6 });
    }
    var np = Math.max(30, Math.min(70, Math.floor(W()/22)));
    petals = [];
    for(var j=0;j<np;j++) petals.push(newPetal(false));
  }
  function tick(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    // 星星（避开月亮盘面）
    var rr = moon.r*1.12, rr2 = rr*rr;
    ctx.fillStyle = '#fff6da';
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var dx = s.x-moon.x, dy = s.y-moon.y;
      if(dx*dx+dy*dy < rr2) continue;
      ctx.globalAlpha = 0.3 + 0.7*Math.abs(Math.sin(t*0.001*s.s + s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    // 花瓣
    for(var k=0;k<petals.length;k++){
      var p = petals[k];
      p.ph += p.ps; p.y += p.vy; p.x += Math.cos(p.ph)*0.55; p.a += p.va;
      if(p.y > H()+30 || p.x < -40 || p.x > W()+40){ petals[k] = newPetal(true); continue; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.globalAlpha = p.o; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*0.55,0,0,6.283); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 200);
  });
  init();
  requestAnimationFrame(tick);

  /* ---------- 孔明灯 ---------- */
  var layer = document.getElementById('lantern-layer');
  var wishChars = ['福','禄','寿','喜','团','圆','安','康','乐','丰'];
  function spawnLantern(ch){
    var d = document.createElement('div');
    d.className = 'lantern';
    d.style.left = (2 + Math.random()*88) + 'vw';
    d.style.setProperty('--dur', (15+Math.random()*10).toFixed(1)+'s');
    d.style.setProperty('--scale', (0.65+Math.random()*0.75).toFixed(2));
    var c = ch || wishChars[(Math.random()*wishChars.length)|0];
    d.innerHTML = '<div class="l-scale"><div class="lantern-inner">' +
      '<div class="lcap"></div><div class="lbody"><span>'+c+'</span></div><div class="lbase"></div>' +
      '</div></div>';
    layer.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 28000);
  }
  for(var k=0;k<4;k++){ (function(i){ setTimeout(function(){ spawnLantern(); }, 900*i); })(k); }
  setInterval(function(){ if(!document.hidden) spawnLantern(); }, 4200);

  /* ---------- 点击许愿 ---------- */
  var wishWords = ['心想事成','花好月圆','团团圆圆','平安喜乐','月圆人圆','好事成双'];
  function sparkle(x, y, word){
    var s = document.createElement('div');
    s.className = 'spark'; s.style.left = x+'px'; s.style.top = y+'px';
    document.body.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1200);
    var t = document.createElement('div');
    t.className = 'wish-text';
    t.textContent = word || wishWords[(Math.random()*wishWords.length)|0];
    t.style.left = x+'px'; t.style.top = (y-8)+'px';
    document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2500);
  }
  document.addEventListener('click', function(e){
    if(e.target.closest('button')) return;
    sparkle(e.clientX, e.clientY);
  });

  var toast = document.getElementById('toast'), toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  document.getElementById('btn-lantern').addEventListener('click', function(){
    for(var i=0;i<3;i++){ (function(j){ setTimeout(function(){ spawnLantern(); }, j*450); })(i); }
    showToast('天灯升起 · 福运绵长 🏮');
  });
  document.getElementById('btn-wish').addEventListener('click', function(){
    var x = W()*(0.25+Math.random()*0.5), y = H()*(0.3+Math.random()*0.3);
    sparkle(x, y);
    showToast('愿望已随月光升起 ✨');
  });

  /* ---------- 祝福轮播 ---------- */
  var blessings = [
    '皓月当空，银辉轻洒人间。愿你与所爱之人团圆美满，岁岁安康，事事如意。',
    '桂花香里话团圆，月饼甜中寄相思。中秋佳节，愿幸福与你不期而遇，温柔以待。',
    '一轮明月照九州，千里相思共此时。愿你的每一个心愿，都如月光般被温柔照亮。',
    '月圆人圆事事圆，花好灯好好事好。愿你中秋快乐，阖家幸福，笑语盈盈。',
    '天上月圆，人间团圆。把思念揉进月光里，寄给远方的你：中秋安康，常喜乐。'
  ];
  var bi = 0, blessingEl = document.getElementById('blessing');
  blessingEl.textContent = blessings[0];
  setInterval(function(){
    blessingEl.classList.add('fade');
    setTimeout(function(){
      bi = (bi+1)%blessings.length;
      blessingEl.textContent = blessings[bi];
      blessingEl.classList.remove('fade');
    }, 800);
  }, 7000);

  /* ---------- 背景音乐（Web Audio 合成） ---------- */
  var actx = null, musicOn = false, noteTimer = null, ni = 0;
  var BEAT = 520;
  var seq = [
    [659.26,1],[587.33,1],[523.25,1],[440.00,1.5],
    [523.25,1],[587.33,1],[659.26,1.5],[783.99,2],
    [659.26,1],[587.33,1],[523.25,1],[587.33,1.5],
    [440.00,2.5],[0,1]
  ];
  function tone(freq, beats){
    if(freq <= 0 || !actx) return;
    var dur = beats*BEAT;
    var t = actx.currentTime;
    var o1 = actx.createOscillator(), o2 = actx.createOscillator();
    var g = actx.createGain(), g2 = actx.createGain();
    o1.type = 'sine'; o1.frequency.value = freq;
    o2.type = 'triangle'; o2.frequency.value = freq; o2.detune.value = 5;
    g2.gain.value = 0.35;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t+0.07);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur/1000);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination);
    o1.start(t); o2.start(t);
    o1.stop(t+dur/1000+0.15); o2.stop(t+dur/1000+0.15);
  }
  function step(){
    if(!musicOn) return;
    var n = seq[ni % seq.length];
    tone(n[0], n[1]);
    ni++;
    noteTimer = setTimeout(step, n[1]*BEAT + 140);
  }
  var btnMusic = document.getElementById('btn-music');
  btnMusic.addEventListener('click', function(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      musicOn = !musicOn;
      if(musicOn){ ni = 0; step(); btnMusic.textContent = '🎵 音乐：开'; showToast('月下清音 · 祝君安康 🎵'); }
      else { if(noteTimer) clearTimeout(noteTimer); btnMusic.textContent = '🎵 音乐：关'; }
    }catch(err){ showToast('当前设备暂不支持播放'); }
  });
})();
</script>
</body>
</html>
